name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  changes:
    name: Changes Detection
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      check: ${{ steps.filter.outputs.check }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/filters.yaml

  setup-develop-env:
    needs: changes
    if: ${{ needs.changes.outputs.check == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup XiangShan environment
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://".insteadOf git://
          sudo -s ./setup-tools.sh
          source ./setup.sh
          if [ -d /opt/graalvm-jdk-21 ]; then
            echo "Overriding CI java environment to use GraalVM JDK 21"
            echo "PATH=/opt/graalvm-jdk-21/bin:${PATH}" >> $GITHUB_ENV
            echo "JAVA_HOME=/opt/graalvm-jdk-21" >> $GITHUB_ENV
          fi
          if [ -d /usr/lib/llvm-19 ]; then
            echo "Overriding CI clang environment to use LLVM 19"
            echo "PATH=/usr/lib/llvm-19/bin:${PATH}" >> $GITHUB_ENV
          fi

      - name: Sim NutShell using Verilator
        run: |
          cd $GITHUB_WORKSPACE
          source ./env-test.sh

  setup-nix-env:
    needs: changes
    if: ${{ needs.changes.outputs.nix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check if nix devshell works
        run: |
          cd $GITHUB_WORKSPACE
          source ./setup.sh
          nix develop --command bash -c "source ./env-test.sh"
