name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  setup-develop-env:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Setup XiangShan environment
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global url."https://".insteadOf git://
          sudo -s ./setup-tools.sh
          source ./setup.sh
          if [ -d /opt/graalvm-jdk-21 ]; then
            echo "Overriding CI java environment to use GraalVM JDK 21"
            echo "PATH=/opt/graalvm-jdk-21/bin:${PATH}" >> $GITHUB_ENV
            echo "JAVA_HOME=/opt/graalvm-jdk-21" >> $GITHUB_ENV
          fi

      - name: Sim NutShell using Verilator
        run: |
          cd $GITHUB_WORKSPACE
          source ./env-test.sh

  setup-nix-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check if nix devshell works
        run: |
          cd $GITHUB_WORKSPACE
          source ./setup.sh
          nix develop --command bash -c "source ./env-test.sh"
